name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validators:
    name: Node validators (gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-static.js
      - run: node tools/build-dist.js
      - run: node --test tools/test-course.js
      - run: node tools/validate-static.js
      - run: node tools/validate-content.js
      - run: node tools/validate-batch2.js
      - run: node tools/validate-jobs.js
      - run: node tools/validate-portfolio.js
      - run: node tools/validate-guided.js

  python-unit:
    name: Python unit tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [log-analyzer, llm-eval, rag-service, sft-lora, inference-benchmark]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r projects/${{ matrix.project }}/requirements.txt
      - name: Run tests (fast path — leftover reference code until phase 5)
        working-directory: projects/${{ matrix.project }}
        env:
          RUN_MODEL_TESTS: "0"
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: pytest -q

  docker-build:
    name: Docker build (rag-service leftover)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rag-service projects/rag-service

  deploy-pages:
    name: Deploy dist to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validators
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-static.js
      - run: node tools/build-dist.js
      # Pages 必须先由 tools/deploy-github.sh 启用成 Actions 源：GITHUB_TOKEN 无权创建站点。
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4

  integration:
    name: Integration tests (manual; downloads models)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [hf-mini-lab, rag-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r projects/${{ matrix.project }}/requirements.txt
      - name: Run tests (full, downloads models)
        working-directory: projects/${{ matrix.project }}
        env:
          RUN_MODEL_TESTS: "1"
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: pytest -q

  # 不含 guided-starters / guided-hf-full：旧 starter 红灯已退出教学流程。
  # python-unit 与 docker-build 只核对仍留在磁盘上的参考代码，直到阶段 5 删除目录。
